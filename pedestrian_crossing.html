<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedestrian Crossing</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            margin-top: 40px;
        }

        #status {
            font-size: 30px;
            margin: 30px;
            font-weight: bold;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Pedestrian Crossing</h1>

    <div id="status">WAIT</div>

    <button onclick="requestCrossing()">
        Request Crossing
    </button>

    <script>
        function requestCrossing() {

            const status = document.getElementById("status");

            status.innerText = "STOP - PEDESTRIANS CROSS";

            setTimeout(function () {
                status.innerText = "WAIT";
            }, 5000);
        }
    </script>

</body>
</html>
